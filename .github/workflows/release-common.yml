name: Release Common

on:
  workflow_call:
    inputs:
      prepare_beta_command:
        required: false
        type: string
        default: ""
      package_args:
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, test and package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run check-types

      - name: Linting
        run: npm run lint

      - name: Testing
        run: xvfb-run -a npm test

      - name: Prepare BETA
        if: ${{ inputs.prepare_beta_command != '' }}
        run: ${{ inputs.prepare_beta_command }}

      - name: Package VSIX
        run: npx @vscode/vsce package --no-dependencies ${{ inputs.package_args }} --out agent-frame.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v6
        with:
          name: vsix
          path: agent-frame.vsix
          if-no-files-found: error
