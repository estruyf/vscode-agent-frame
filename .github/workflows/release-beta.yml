name: BETA Release

on:
  push:
    branches:
      - dev
      - alpha
  workflow_dispatch:

permissions:
  contents: read

env:
  MS_URL: "https://marketplace.visualstudio.com/items?itemName=eliostruyf.vscode-agent-frame"
  VSX_URL: "https://open-vsx.org/extension/eliostruyf/vscode-agent-frame"

jobs:
  build-and-test:
    uses: ./.github/workflows/release-common.yml
    with:
      prepare_beta_command: ${{ github.ref != 'refs/heads/alpha' && format('node ./scripts/beta-release.mjs {0}', github.run_id) || '' }}
      package_args: ${{ github.ref != 'refs/heads/alpha' && '--pre-release --baseImagesUrl https://raw.githubusercontent.com/estruyf/vscode-agent-frame/dev' || '' }}

  release-ms:
    name: "Release to VSCode Marketplace"
    runs-on: ubuntu-latest
    needs: build-and-test
    if: contains(github.event.head_commit.message, '#release') && github.ref != 'refs/heads/alpha'
    environment:
      name: "Microsoft Marketplace"
      url: ${{ env.MS_URL }}

    steps:
      - name: Download VSIX
        uses: actions/download-artifact@v6
        with:
          name: vsix

      - name: Publish
        run: npx @vscode/vsce publish --packagePath agent-frame.vsix -p ${{ secrets.VSCE_PAT }} --pre-release --no-dependencies

  release-vsx:
    name: "Release to Open VSX"
    runs-on: ubuntu-latest
    needs: build-and-test
    if: contains(github.event.head_commit.message, '#release') && github.ref != 'refs/heads/alpha'
    environment:
      name: "Open VSX"
      url: ${{ env.VSX_URL }}

    steps:
      - name: Download VSIX
        uses: actions/download-artifact@v6
        with:
          name: vsix

      - name: Publish to open-vsx.org
        run: npx ovsx publish agent-frame.vsix -p ${{ secrets.OPEN_VSX_PAT }} --pre-release --no-dependencies
